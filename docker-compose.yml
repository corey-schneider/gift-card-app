# Docker Compose configuration for VaultCards Gift Card Storage App
# Usage:
#   docker compose up -d --build
#
# Access at: http://localhost:3000
#
# Security:
#   The master key is read either from the git-ignored ./config/master.key mount
#   or from the RAILS_MASTER_KEY environment variable. No secrets are stored in this file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gift_card_app:latest
    container_name: gift_card_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    environment:
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY:-}
      - APP_UNLOCK_PIN=${APP_UNLOCK_PIN:-}
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_LOG_TO_STDOUT=true
    volumes:
      - gift_card_storage:/rails/storage
      # Mount the local git-ignored master.key directly into the container:
      - ./config/master.key:/rails/config/master.key:ro

volumes:
  gift_card_storage:
    driver: local
